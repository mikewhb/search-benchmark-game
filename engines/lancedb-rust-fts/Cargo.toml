[package]
name = "lancedb-rust-fts"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[[bin]]
name = "do_query"
path = "src/bin/do_query.rs"

[[bin]]
name = "do_check"
path = "src/bin/do_check.rs"

[dependencies]
lancedb = "0.23.0"
lance-index = "1.0"
arrow-array = "56"
arrow-schema = "56"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
regex = "1.10"
chrono = "0.4"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
