[package]
name = "lance-f03a2783c24f-bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "build_index"
path = "src/bin/build_index.rs"

[[bin]]
name = "do_query"
path = "src/bin/do_query.rs"

[[bin]]
name = "probe_wiki"
path = "src/bin/probe_wiki.rs"

[[bin]]
name = "phase_timing"
path = "src/bin/phase_timing.rs"

[dependencies]
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
lance = { path = "/data/arrow/code/lance-distributed-foyer/rust/lance", default-features = false }
lance-index = { path = "/data/arrow/code/lance-distributed-foyer/rust/lance-index", default-features = false }
lance-datafusion = { path = "/data/arrow/code/lance-distributed-foyer/rust/lance-datafusion", default-features = false }
datafusion = { version = "54.0.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros"] }

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
overflow-checks = false

# Same codegen as release, plus symbols/frame pointers for perf/flamegraphs.
[profile.profiling]
inherits = "release"
debug = true
strip = false
